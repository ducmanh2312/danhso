<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Text Processor Nâng Cấp</title>
    <!-- Tải Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* Sử dụng font Inter cho giao diện */
        body {
            font-family: 'Inter', sans-serif;
        }
        /* Tùy chỉnh thanh cuộn cho Firefox */
        #result {
            scrollbar-width: thin;
            scrollbar-color: #9ca3af #f3f4f6;
        }
        /* Tùy chỉnh thanh cuộn cho Chrome, Safari, Edge */
        #result::-webkit-scrollbar {
            width: 8px;
        }
        #result::-webkit-scrollbar-track {
            background: #f3f4f6;
            border-radius: 4px;
        }
        #result::-webkit-scrollbar-thumb {
            background-color: #9ca3af;
            border-radius: 4px;
            border: 2px solid #f3f4f6;
        }
    </style>
    <!-- Tải font Inter từ Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body class="bg-gray-100 flex items-center justify-center min-h-screen p-4">

    <!-- Card chính -->
    <div class="bg-white p-6 sm:p-8 rounded-xl shadow-xl w-full max-w-2xl">
        
        <!-- Tiêu đề -->
        <h1 class="text-3xl font-bold text-center mb-6 text-gray-800">
            Text Processor
        </h1>

        <!-- Form nhập liệu -->
        <form id="text-form" class="space-y-6">
            
            <!-- Vùng nhập văn bản -->
            <div>
                <label for="text" class="block text-sm font-medium text-gray-700 mb-2">Nhập danh sách:</label>
                <textarea id="text" name="text" rows="10" required class="w-full p-3 border border-gray-300 rounded-md shadow-sm focus:ring-2 focus:ring-blue-500 focus:border-transparent transition duration-200 resize-y" placeholder="Nhập văn bản của bạn ở đây..."></textarea>
            </div>

            <!-- Cài đặt -->
            <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                <!-- Số bắt đầu -->
                <div>
                    <label for="start_number" class="block text-sm font-medium text-gray-700 mb-2">Số bắt đầu:</label>
                    <input type="number" id="start_number" name="start_number" value="1" required class="w-full p-3 border border-gray-300 rounded-md shadow-sm focus:ring-2 focus:ring-blue-500 focus:border-transparent transition duration-200">
                </div>

                <!-- Lựa chọn cách đánh số -->
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-2">Chọn cách đánh số:</label>
                    <div class="space-y-2">
                        <div class="flex items-center">
                            <input type="radio" id="head" name="choice" value="1" class="h-4 w-4 text-blue-600 border-gray-300 focus:ring-blue-500" checked>
                            <label for="head" class="ml-3 block text-sm text-gray-700">Đánh số ở đầu dòng</label>
                        </div>
                        <div class="flex items-center">
                            <input type="radio" id="tail" name="choice" value="2" class="h-4 w-4 text-blue-600 border-gray-300 focus:ring-blue-500">
                            <label for="tail" class="ml-3 block text-sm text-gray-700">Đánh số ở cuối dòng</label>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Các nút hành động -->
            <div class="flex flex-col sm:flex-row gap-4">
                <button type="button" onclick="processTextAndCopy()" class="w-full bg-green-600 text-white py-3 px-4 rounded-md font-semibold hover:bg-green-700 focus:outline-none focus:ring-2 focus:ring-green-500 focus:ring-offset-2 transition duration-200 shadow-md">
                    Xử lý và Sao chép
                </button>
            </div>
        </form>

        <!-- Vùng kết quả -->
        <div class="mt-6">
            <label for="result" class="block text-sm font-medium text-gray-700 mb-2">Kết quả:</label>
            <div id="result" class="w-full p-4 bg-gray-50 border border-gray-200 rounded-md min-h-[150px] max-h-[300px] overflow-y-auto whitespace-pre-wrap font-mono text-sm text-gray-800"></div>
        </div>
    </div>

    <!-- Thông báo "Toast" (thay thế cho alert) -->
    <div id="toast" class="fixed bottom-4 right-4 bg-gray-900 text-white py-2 px-5 rounded-lg shadow-xl transition-all duration-300 ease-in-out opacity-0 transform translate-y-4">
        Đã sao chép!
    </div>

    <script>
        // Lấy phần tử toast
        const toast = document.getElementById('toast');
        let toastTimer;

        /**
         * Hiển thị thông báo toast
         * @param {string} message - Nội dung thông báo
         * @param {string} [type='success'] - Loại thông báo ('success' hoặc 'error')
         */
        function showToast(message, type = 'success') {
            // Xóa bộ đếm thời gian cũ nếu có
            clearTimeout(toastTimer);

            toast.textContent = message;
            
            // Đặt màu dựa trên loại
            if (type === 'error') {
                toast.classList.remove('bg-gray-900');
                toast.classList.add('bg-red-600');
            } else {
                toast.classList.remove('bg-red-600');
                toast.classList.add('bg-gray-900');
            }

            // Hiển thị toast
            toast.classList.remove('opacity-0', 'translate-y-4');
            toast.classList.add('opacity-100', 'translate-y-0');

            // Ẩn toast sau 3 giây
            toastTimer = setTimeout(() => {
                toast.classList.remove('opacity-100', 'translate-y-0');
                toast.classList.add('opacity-0', 'translate-y-4');
            }, 3000);
        }

        /**
         * Xử lý văn bản và trả về kết quả
         * @returns {string|null} - Chuỗi kết quả hoặc null nếu có lỗi
         */
        function processText() {
            // Lấy dữ liệu từ form
            const text = document.getElementById('text').value;
            const startNumber = parseInt(document.getElementById('start_number').value);
            const choice = document.querySelector('input[name="choice"]:checked').value;

            if (!text) {
                showToast("Vui lòng nhập danh sách.", 'error');
                return null;
            }

            // Xử lý văn bản
            const lines = text.split('\n');
            // Lọc ra các dòng không rỗng
            const nonEmptyLines = lines.filter(line => line.trim() !== ''); 
            
            const processedLines = nonEmptyLines.map(line => line.replace(/\.\.\./g, "'"));
            let result = '';
            let currentNumber = startNumber;

            for (let i = 0; i < processedLines.length; i++) {
                const number = String(currentNumber).padStart(2, '0');
                if (choice === '1') {
                    // Đánh số ở đầu
                    result += `${number}. ${processedLines[i]}\n`;
                } else if (choice === '2') {
                    // Đánh số ở cuối
                    result += `${processedLines[i].trim()} .${number}\n`;
                }
                currentNumber++;
            }
            
            return result;
        }

        /**
         * Xử lý văn bản, hiển thị kết quả và sao chép vào clipboard
         */
        function processTextAndCopy() {
            // 1. Xử lý văn bản và hiển thị
            const result = processText();
            
            if (result === null) return; // Dừng nếu không có văn bản (processText đã show toast)

            // Hiển thị kết quả lên trang
            const resultDiv = document.getElementById('result');
            resultDiv.textContent = result;
            
            // 2. Sao chép kết quả
            const textToCopy = resultDiv.textContent; // Lấy text từ div

            if (!textToCopy) {
                showToast('Không có dữ liệu để sao chép.', 'error');
                return;
            }

            // Tạo một textarea tạm thời để sao chép
            const textarea = document.createElement('textarea');
            textarea.value = textToCopy;
            textarea.style.position = 'fixed'; // Ẩn khỏi màn hình
            textarea.style.opacity = '0';
            document.body.appendChild(textarea);
            
            textarea.select();
            textarea.setSelectionRange(0, 99999); // Dành cho thiết bị di động

            try {
                // Sử dụng document.execCommand để tương thích rộng rãi
                const successful = document.execCommand('copy');
                if (successful) {
                    showToast('Đã sao chép kết quả vào clipboard.');
                } else {
                    showToast('Sao chép thất bại.', 'error');
                }
            } catch (err) {
                showToast('Lỗi khi sao chép: ' + err, 'error');
            }

            // Xóa textarea tạm thời
            document.body.removeChild(textarea);
        }
    </script>
</body>
</html>
